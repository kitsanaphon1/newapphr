name: Build & Secure Deploy

on:
  push:
    branches: [dev]

permissions:
  contents: read
  security-events: write

jobs:
  devsecops-pipeline:
    runs-on: ubuntu-latest

    steps:
      # 📥 Checkout source code
      - name: 📥 Checkout Code
        uses: actions/checkout@v3

      # 🧪 Install dependencies
      - name: 📦 Install Dependencies
        run: npm install

      # 🔍 Static Code Analysis (ESLint)
      - name: 🔍 Run ESLint
        run: npm run lint || true

      # 🔐 Scan Node.js dependencies
      - name: 🔐 npm Audit
        run: npm audit --audit-level=moderate || true

      # 🧪 Unit Tests
      - name: 🧪 Run Unit Tests
        run: npm run test

      # 🐳 Set up Docker Buildx
      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 🔐 Login to Docker Hub
      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 🐳 Build Docker Image
      - name: 🐳 Build Docker Image
        run: docker build -t apphr:latest .

      # 🔍 Scan Docker Image with Trivy
      - name: 🔍 Scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'apphr:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'

      # 📤 Upload Trivy results to GitHub Dashboard
      - name: 📤 Upload Trivy Report to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      # 🚀 Push Docker image to Docker Hub
      - name: 🚀 Push Docker Image
        run: |
          docker tag apphr:latest sooyaa02/apphr:latest
          docker push sooyaa02/apphr:latest

      # 📧 Send Email Notification
      - name: 📧 Send Mail Notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "✅ CI/CD Pipeline Succeeded"
          to: chol.www02@gmail.com
          from: GitHub CI <${{ secrets.MAIL_USERNAME }}>
          body: |
            ✅ All CI steps completed successfully.
            - ✅ Code Lint Passed
            - ✅ Unit Tests Passed
            - ✅ Docker Image Built & Pushed
            - ✅ Trivy Scan Uploaded to Dashboard
